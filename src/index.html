<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban.md</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E.t%7Bfill:%232F5BEA%7D.h%7Bstroke:%23C9D6FF%7D.a%7Bfill:%23fff%7D.b%7Bfill:%239BB3FF%7D@media(prefers-color-scheme:dark)%7B.t%7Bfill:%231B1F26;stroke:%23343B47;stroke-width:1.5px%7D.h%7Bstroke:%237B9BFF%7D.a%7Bfill:%23E8EAEE%7D.b%7Bfill:%237B9BFF%7D%7D%3C/style%3E%3Crect class='t' x='.75' y='.75' width='62.5' height='62.5' rx='14.5'/%3E%3Cpath class='h' d='M15.4 12.8 14.4 26.4M20 12.8 19 26.4M12 17.2h10.8M11.6 22.4h10.8' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3Crect class='a' x='26.5' y='12' width='11' height='40' rx='3'/%3E%3Crect class='b' x='42' y='12' width='11' height='28' rx='3'/%3E%3C/svg%3E">
    <style>
        /* build:css */
    </style>
</head>
<body>
    <header class="header">
        <div class="menu-wrap">
            <button class="btn btn-ghost btn-icon" id="moreMenuBtn" onclick="toggleMoreMenu(event)" aria-haspopup="true" aria-expanded="false" title="Menu" aria-label="Menu"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
            <div class="popover" id="moreMenu" onclick="event.stopPropagation()">
                <button id="archiveBtn" class="menu-item" style="display: none;" onclick="closeMenus()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12v3H2zM3 7v6h10V7M6.5 9.5h3"/></svg><span class="mi-label">Archives</span></button>
                <button id="manageColsBtn" class="menu-item" style="display: none;" onclick="closeMenus()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3h3v10h-3zM6.5 3h3v10h-3zM10.5 3h3v10h-3z"/></svg><span class="mi-label">Columns</span></button>
                <button id="orderToggleBtn" class="menu-item" style="display: none;" onclick="closeMenus(); toggleManualOrder()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M3 11l2 2 2-2M11 13V3M9 5l2-2 2 2"/></svg><span class="mi-label">Manual order</span></button>
                <button id="orderResetBtn" class="menu-item" style="display: none;" onclick="closeMenus(); resetOrderById()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h7M3 8h5M3 12h3M12 5v7M10 10l2 2 2-2"/></svg><span class="mi-label">Reset order by task id</span></button>
                <button id="housekeepingBtn" class="menu-item" style="display: none;" onclick="closeMenus(); editHousekeepingSettings()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M5 4.5l.5 8.5h5l.5-8.5"/></svg><span class="mi-label">Housekeeping</span></button>
                <button id="backlogOpenBtn" class="menu-item" style="display: none;" onclick="closeMenus(); openBacklogModal()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12v3H2zM3 6.5v6h10v-6M6.5 9h3"/></svg><span class="mi-label">Open backlog</span></button>
                <button id="backlogToggleBtn" class="menu-item" style="display: none;" onclick="closeMenus(); toggleBacklogFile()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7l3 3v8H3zM10 2.5v3h3M5.5 9h5M5.5 11.5h5"/></svg><span class="mi-label">Backlog file</span></button>
                <button id="selectFolderBtn" class="menu-item" onclick="closeMenus()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg><span class="mi-label">Folder</span></button>
                <button id="openUrlBtn" class="menu-item" onclick="closeMenus(); openBoardFromUrl()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg><span class="mi-label">Open from a web address…</span></button>
                <div class="menu-sep"></div>
                <button id="renameProjectBtn" class="menu-item" style="display: none;" title="Rename project" onclick="closeMenus(); renameCurrentProject()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3L5 14H2v-3z"/></svg><span class="mi-label">Rename project</span></button>
                <button id="deleteProjectBtn" class="menu-item danger" style="display: none;" title="Delete project" onclick="closeMenus(); deleteCurrentProject()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M5 4.5l.5 8.5h5l.5-8.5"/></svg><span class="mi-label">Delete project</span></button>
                <div class="menu-sep"></div>
                <div class="menu-row"><span class="menu-label"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg><span id="languageLabel">Language</span></span>
                    <div class="dd dd-field dd-compact">
                        <input type="hidden" id="languageSelector" value="en" onchange="setLanguage(this.value)">
                        <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="languageLabel"></button>
                        <div class="dd-menu" role="listbox"></div>
                    </div>
                </div>
                <div class="menu-sep"></div>
                <a id="homeLink" class="menu-item" href="https://ashikahmad.github.io/Kanban.md/" target="_blank" rel="noopener" onclick="closeMenus()"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg><span class="mi-label">Kanban.md website</span></a>
            </div>
        </div>
        <h1><svg class="app-logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" style="fill:var(--logo-tile);stroke:var(--logo-ring)" stroke-width="1.5"/><g style="stroke:var(--logo-hash)" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M15.4 12.8 14.4 26.4M20 12.8 19 26.4M12 17.2h10.8M11.6 22.4h10.8"/></g><rect x="26.5" y="12" width="11" height="40" rx="3" style="fill:var(--logo-tall)"/><rect x="42" y="12" width="11" height="28" rx="3" style="fill:var(--logo-short)"/></svg><span id="headerTitle">Kanban.md</span></h1>
        <div class="dd dd-field dd-compact" id="projectDd" style="display: none;">
            <input type="hidden" id="projectSelector">
            <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Project"></button>
            <div class="dd-menu" role="listbox"></div>
        </div>
        <div id="filterBar">
            <div class="filter-row">
                <div class="search-field">
                    <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
                    <input type="text" id="globalSearchInput" placeholder="Search..." oninput="applyGlobalSearch()" aria-label="Search">
                    <button id="clearGlobalSearch" onclick="clearGlobalSearch()" title="Clear search" aria-label="Clear search">&times;</button>
                </div>
                <button class="btn btn-secondary" id="filterToggleBtn" onclick="toggleFilterPanel(event)" aria-haspopup="true" aria-expanded="false">
                    <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M7 12.5h2"/></svg><span id="filterToggleLabel">Filters</span><span class="filter-count" id="filterCount" style="display: none;">0</span>
                </button>
                <div class="filter-group" id="filterPanel" onclick="event.stopPropagation()">
                    <div class="fdrop dd" data-type="tag">
                        <button class="fbtn dd-trigger" aria-haspopup="true" aria-expanded="false"><span class="flabel">Tags</span><span class="fcount"></span><svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg></button>
                        <div class="fmenu dd-menu" id="fmenu-tag" role="group"></div>
                    </div>
                    <div class="fdrop dd" data-type="category">
                        <button class="fbtn dd-trigger" aria-haspopup="true" aria-expanded="false"><span class="flabel">Category</span><span class="fcount"></span><svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg></button>
                        <div class="fmenu dd-menu" id="fmenu-category" role="group"></div>
                    </div>
                    <div class="fdrop dd" data-type="user">
                        <button class="fbtn dd-trigger" aria-haspopup="true" aria-expanded="false"><span class="flabel">User</span><span class="fcount"></span><svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg></button>
                        <div class="fmenu dd-menu" id="fmenu-user" role="group"></div>
                    </div>
                    <div class="fdrop dd" data-type="priority">
                        <button class="fbtn dd-trigger" aria-haspopup="true" aria-expanded="false"><span class="flabel">Priority</span><span class="fcount"></span><svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg></button>
                        <div class="fmenu dd-menu" id="fmenu-priority" role="group"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-spacer"></div>
        <button id="newTaskBtn" class="btn btn-primary" style="display: none;">Task</button>
        <div class="menu-wrap">
            <button class="btn btn-ghost btn-icon" id="themeMenuBtn" onclick="toggleThemeMenu(event)" aria-haspopup="true" aria-expanded="false" title="Theme" aria-label="Theme"></button>
            <div class="popover" id="themeMenu" onclick="event.stopPropagation()">
                <button class="menu-item" data-theme-mode="auto" onclick="setThemeMode('auto')"><span class="check"></span><span class="lbl">Auto</span></button>
                <button class="menu-item" data-theme-mode="light" onclick="setThemeMode('light')"><span class="check"></span><span class="lbl">Light</span></button>
                <button class="menu-item" data-theme-mode="dark" onclick="setThemeMode('dark')"><span class="check"></span><span class="lbl">Dark</span></button>
            </div>
        </div>
    </header>
    <div id="activeFilters"></div>
    <div id="housekeepingBar" class="hk-bar" style="display: none;" role="status"></div>
    <div id="sourceBar" class="source-bar" style="display: none;" role="status"></div>

    <div class="container">
        <div id="welcomeScreen" class="welcome"></div>
    </div>

    <div id="kanbanView" style="display: none;">
        <div id="debugInfo" class="debug-info" style="display: none;"></div>
        <div class="kanban-board" id="kanbanBoard"></div>
    </div>

    <!-- Modal Task Detail -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Task details</h2>
                <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
            </div>
            <div id="modalBody" class="task-detail"></div>
            <div id="taskModalActions" class="actions"></div>
        </div>
    </div>

    <!-- Share a task -->
    <div id="shareModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="shareModalTitle">Share task</h2>
                <button class="close-btn" onclick="closeShareDialog()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="share-row">
                    <button type="button" id="shareFormatText" class="btn btn-primary btn-sm" onclick="setShareOption('format', 'text')">Plain text</button>
                    <button type="button" id="shareFormatMd" class="btn btn-secondary btn-sm" onclick="setShareOption('format', 'markdown')">Markdown</button>
                    <span class="share-view" id="shareView" role="group" style="margin-left:auto;display:none;">
                        <button type="button" id="shareViewRaw" class="btn btn-sm" onclick="setShareOption('view', 'raw')" aria-label="Raw Markdown" title="Raw Markdown"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></button>
                        <button type="button" id="shareViewRendered" class="btn btn-sm" onclick="setShareOption('view', 'rendered')" aria-label="Preview" title="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </span>
                </div>
                <div id="shareRendered" class="share-rendered" style="display:none;"></div>
                <textarea id="sharePreview" class="share-preview" readonly rows="12" spellcheck="false"></textarea>
                <label id="shareNotesRow" class="share-opt"><input type="checkbox" id="shareNotes" onchange="setShareOption('notes', this.checked)"> <span id="shareNotesLabel">Include notes</span></label>
                <label id="shareAssigneesRow" class="share-opt"><input type="checkbox" id="shareAssignees" onchange="setShareOption('assignees', this.checked)"> <span id="shareAssigneesLabel">Include assignees</span></label>
                <p id="shareHint" class="share-hint"></p>
            </div>
            <div class="actions">
                <button type="button" id="shareCopyBtn" class="btn btn-primary" onclick="copyShare()">Copy</button>
                <button type="button" id="shareNativeBtn" class="btn btn-secondary" onclick="nativeShare()" style="display: none;">Share…</button>
            </div>
        </div>
    </div>

    <!-- Modal New Task -->
    <div id="newTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New task</h2>
                <button class="close-btn" onclick="closeTaskModal()" aria-label="Close">&times;</button>
            </div>
            <form id="newTaskForm" class="form-stack">
                <input type="hidden" id="taskEditId">
                <div class="field">
                    <label for="taskTitle">Title *</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-grid cols-2">
                    <div class="field">
                        <label id="taskStatusLabel" for="taskStatus">Column *</label>
                        <div class="dd dd-field">
                            <input type="hidden" id="taskStatus">
                            <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="taskStatusLabel"></button>
                            <div class="dd-menu" role="listbox"></div>
                        </div>
                    </div>
                    <div class="field">
                        <label id="taskPriorityLabel" for="taskPriority">Priority</label>
                        <div class="dd dd-field">
                            <input type="hidden" id="taskPriority">
                            <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="taskPriorityLabel"></button>
                            <div class="dd-menu" role="listbox"></div>
                        </div>
                    </div>
                </div>
                <div class="form-grid cols-2">
                    <div class="field">
                        <label for="taskCategory">Category</label>
                        <input type="text" id="taskCategory" list="categoriesList" placeholder="Frontend, Backend...">
                    </div>
                    <div class="field">
                        <label for="taskAssignee">Assigned to</label>
                        <input type="text" id="taskAssignee" list="usersList" placeholder="@alice">
                    </div>
                </div>
                <div class="form-grid cols-4">
                    <div class="field"><label for="taskCreated">Created</label><input type="date" id="taskCreated"></div>
                    <div class="field"><label for="taskStarted">Started</label><input type="date" id="taskStarted"></div>
                    <div class="field"><label for="taskDue">Due</label><input type="date" id="taskDue"></div>
                    <div class="field"><label for="taskCompleted">Finished</label><input type="date" id="taskCompleted"></div>
                </div>
                <div class="field">
                    <label for="taskTags">Tags</label>
                    <input type="text" id="taskTags" list="tagsList" placeholder="#bug #feature">
                    <small>Separate with spaces</small>
                </div>
                <div class="field">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3"></textarea>
                </div>
                <div class="field">
                    <label>Subtasks</label>
                    <ul id="formSubtasksList" class="subtask-list"></ul>
                    <div class="subtask-add">
                        <input type="text" id="formSubtaskInput" placeholder="Add a subtask...">
                        <button type="button" onclick="addFormSubtask()" class="btn btn-secondary">+ Add</button>
                    </div>
                </div>
                <div class="field">
                    <label for="taskNotes">Notes</label>
                    <textarea id="taskNotes" rows="5"></textarea>
                    <small>Markdown supported</small>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="taskFormSubmitBtn">Create</button>
                </div>
            </form>
            <!-- Datalists for autocomplete -->
            <datalist id="categoriesList"></datalist>
            <datalist id="usersList"></datalist>
            <datalist id="tagsList"></datalist>
        </div>
    </div>

    <!-- Modal Manage Columns -->
    <div id="columnsModal" class="modal">
        <div class="modal-content narrow" style="max-width: 560px;">
            <div class="modal-header">
                <h2 id="columnsModalTitle">Manage columns</h2>
                <button class="close-btn" onclick="closeColumnsModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="columnsList" class="list-rows"></div>
                <button id="addColumnBtn" onclick="addColumn()" class="btn btn-secondary" style="margin-top: var(--s-3); width: 100%;">+ Add column</button>
            </div>
        </div>
    </div>

    <!-- Modal Archives -->
    <div id="archiveModal" class="modal">
        <div class="modal-content wide">
            <div class="modal-header">
                <h2 id="archiveModalTitle">Archives</h2>
                <button class="close-btn" onclick="closeArchiveModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="archiveSearch" placeholder="Search archives..." style="margin-bottom: var(--s-3);">
                <div id="archiveList" class="list-rows" onclick="onArchiveListClick(event)" style="max-height: 500px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- Backlog file panel -->
    <div id="backlogModal" class="modal">
        <div class="modal-content wide">
            <div class="modal-header">
                <h2 id="backlogModalTitle">Backlog</h2>
                <button class="close-btn" onclick="closeBacklogModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="backlogSearch" placeholder="Search backlog..." style="margin-bottom: var(--s-3);">
                <div id="backlogList" class="list-rows" onclick="onBacklogListClick(event)" style="max-height: 500px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <span id="notificationText"></span>
    </div>

    <script>
        /* build:js */
    </script>
</body>
</html>
